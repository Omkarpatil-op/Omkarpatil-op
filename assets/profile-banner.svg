<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="460" viewBox="0 0 1440 460" role="img" aria-labelledby="title desc">
<title id="title">Omkar Patil — Software Engineer</title>
<desc id="desc">A premium dark software engineering banner with a code editor mockup, system nodes, and measurable engineering impact.</desc>
<defs>
