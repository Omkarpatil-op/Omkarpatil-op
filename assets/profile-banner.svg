    <path d="M880 62h70l22 22h66"/><path d="M920 110h56l18-18h80"/><path d="M888 158h78l20 20h88"/>
    <circle cx="880" cy="62" r="4" fill="#42e8c4"/><circle cx="1038" cy="84" r="4" fill="#9b8cff"/>
    <circle cx="920" cy="110" r="4" fill="#42e8c4"/><circle cx="1074" cy="92" r="4" fill="#9b8cff"/>
    <circle cx="888" cy="158" r="4" fill="#42e8c4"/><circle cx="1074" cy="178" r="4" fill="#9b8cff"/>
  </g>
  <g transform="translate(72 61)">
