<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="350" viewBox="0 0 1200 350" role="img" aria-labelledby="title desc">
  <title id="title">Omkar Patil — Backend Systems, Applied AI, Product Engineering</title>
  <desc id="desc">A dark, technical banner with a teal and violet signal motif and a focus on measurable engineering impact.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="0.58" stop-color="#111b31"/><stop offset="1" stop-color="#15152b"/></linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#42e8c4"/><stop offset="1" stop-color="#9b8cff"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#b9c8e8" stroke-opacity="0.07" stroke-width="1"/></pattern>
  </defs>
  <rect width="1200" height="350" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="350" rx="22" fill="url(#grid)"/>
  <path d="M0 278 C180 210 240 340 420 270 S700 160 850 240 S1050 320 1200 205" fill="none" stroke="url(#signal)" stroke-width="2" stroke-opacity="0.23"/>
  <path d="M0 300 C180 232 240 362 420 292 S700 182 850 262 S1050 342 1200 227" fill="none" stroke="url(#signal)" stroke-width="1" stroke-opacity="0.20"/>
