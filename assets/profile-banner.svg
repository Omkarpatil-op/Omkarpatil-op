    <text x="30" y="34" fill="#9aa9c7" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="4">ENGINEERING PORTFOLIO / 2026</text>
    <text x="27" y="105" fill="#f4f7ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="56" font-weight="800" letter-spacing="-1.8">OMKAR PATIL</text>
