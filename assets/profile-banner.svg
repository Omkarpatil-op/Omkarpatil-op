  <text x="23" y="149" fill="#617493" font-size="12">03</text><text x="58" y="149" fill="#A5B4CE" font-size="14">pipelineScale:</text><text x="205" y="149" fill="#6CF3C5" font-size="15">"2.5x"</text><text x="267" y="149" fill="#E3EAF8" font-size="15">,</text>
  <text x="23" y="182" fill="#617493" font-size="12">04</text><text x="58" y="182" fill="#A5B4CE" font-size="14">hoursSavedMonthly:</text><text x="266" y="182" fill="#6CF3C5" font-size="15">"~40"</text><text x="315" y="182" fill="#E3EAF8" font-size="15">,</text>
  <text x="23" y="215" fill="#617493" font-size="12">05</text><text x="58" y="215" fill="#A5B4CE" font-size="14">approach:</text><text x="161" y="215" fill="#F3B7D3" font-size="15">"reliable by design"</text>
  <text x="23" y="248" fill="#617493" font-size="12">06</text><text x="54" y="248" fill="#E3EAF8" font-size="15">};</text>
  <rect x="22" y="271" width="536" height="34" rx="8" fill="#0C1322" stroke="#344969" stroke-opacity=".7"/>
  <circle cx="39" cy="288" r="4" fill="#6CF3C5"/><text x="54" y="293" fill="#9EB0CE" font-size="12">metrics sourced</text><text x="161" y="293" fill="#536A8D" font-size="12">/</text><text x="177" y="293" fill="#9EB0CE" font-size="12">fallbacks designed</text><text x="327" y="293" fill="#536A8D" font-size="12">/</text><text x="343" y="293" fill="#9EB0CE" font-size="12">impact tracked</text>
</g>
