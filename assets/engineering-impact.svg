<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Selected engineering impact metrics</title>
  <desc id="desc">A bar chart of reported percentage changes: API latency reduced by 30 percent, database retrieval time reduced by 25 percent, redundant queries reduced by 20 percent, and quiz scores improved by 18 percent. Separate callouts show data-validation pipeline scale at 2.5 times and approximately 40 hours saved each month.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1424"/><stop offset="1" stop-color="#14172d"/></linearGradient>
    <linearGradient id="barA" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#36d9b4"/><stop offset="1" stop-color="#75f0d4"/></linearGradient>
    <linearGradient id="barB" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8b7dff"/><stop offset="1" stop-color="#b9aaff"/></linearGradient>
  </defs>
  <rect width="1200" height="520" rx="22" fill="url(#bg)" stroke="#43506f" stroke-opacity="0.65"/>
  <text x="44" y="51" fill="#f4f7ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="800">SELECTED ENGINEERING IMPACT</text>
  <text x="44" y="78" fill="#9aa9c7" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" letter-spacing="1.4">MEASURED OUTCOMES  /  DIFFERENT BASELINES</text>
  <line x1="44" y1="101" x2="1156" y2="101" stroke="#526180" stroke-opacity="0.48"/>
  <text x="44" y="136" fill="#c8d2e8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700">OUTCOME</text>
  <text x="410" y="136" fill="#9aa9c7" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">CHANGE MAGNITUDE</text>
  <g stroke="#8c9bb8" stroke-opacity="0.18" stroke-dasharray="3 5">
    <line x1="470" y1="151" x2="470" y2="423"/><line x1="550" y1="151" x2="550" y2="423"/>
    <line x1="630" y1="151" x2="630" y2="423"/><line x1="710" y1="151" x2="710" y2="423"/>
  </g>
  <g fill="#7f8eac" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" text-anchor="middle">
    <text x="470" y="449">0%</text><text x="550" y="449">10%</text><text x="630" y="449">20%</text><text x="710" y="449">30%</text>
  </g>
  <g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#e8edf8">
    <text x="44" y="184">API response latency</text><text x="44" y="254">Database retrieval time</text><text x="44" y="324">Redundant finance queries</text><text x="44" y="394">SmartSeed quiz scores</text>
  </g>
  <g>
    <rect x="410" y="163" width="300" height="27" rx="7" fill="#232d43"/>
    <rect x="410" y="233" width="300" height="27" rx="7" fill="#232d43"/>
    <rect x="410" y="303" width="300" height="27" rx="7" fill="#232d43"/>
    <rect x="410" y="373" width="300" height="27" rx="7" fill="#232d43"/>
    <rect x="410" y="163" width="240" height="27" rx="7" fill="url(#barA)"/>
    <rect x="410" y="233" width="200" height="27" rx="7" fill="url(#barA)"/>
    <rect x="410" y="303" width="160" height="27" rx="7" fill="url(#barB)"/>
    <rect x="410" y="373" width="144" height="27" rx="7" fill="url(#barB)"/>
  </g>
  <g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="800">
    <text x="730" y="183" fill="#62e9c8">−30%</text><text x="730" y="253" fill="#62e9c8">−25%</text>
    <text x="730" y="323" fill="#b5a7ff">−20%</text><text x="730" y="393" fill="#b5a7ff">+18%</text>
  </g>
  <line x1="824" y1="126" x2="824" y2="455" stroke="#526180" stroke-opacity="0.55"/>
  <g transform="translate(858 150)">
    <rect width="286" height="125" rx="16" fill="#101b2c" stroke="#3bd8b4" stroke-opacity="0.55"/>
    <text x="22" y="29" fill="#9aa9c7" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">PIPELINE SCALE</text>
    <text x="22" y="77" fill="#5ee8c8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="43" font-weight="800">2.5×</text>
    <text x="22" y="103" fill="#e8edf8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">Data-validation pipelines scaled</text>
  </g>
  <g transform="translate(858 294)">
    <rect width="286" height="125" rx="16" fill="#101b2c" stroke="#9587ff" stroke-opacity="0.60"/>
    <text x="22" y="29" fill="#9aa9c7" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">OPERATIONAL TIME</text>
    <text x="22" y="77" fill="#b5a7ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="43" font-weight="800">~40 h</text>
    <text x="22" y="103" fill="#e8edf8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">Saved per month for operations</text>
  </g>
  <text x="44" y="490" fill="#7f8eac" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11">Reported internship and project outcomes. Percentages describe different metrics and should not be read as a single score.</text>
</svg>
