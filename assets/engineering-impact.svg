<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">Engineering impact dashboard</title><desc id="desc">Dashboard showing reported results from backend internship and product projects: 30 percent less API latency, 25 percent faster database retrieval, 20 percent fewer redundant queries, an 18 percent improvement in quiz scores, 2.5 times pipeline scale and about 40 operating hours saved per month.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B101B"/><stop offset="1" stop-color="#121A2D"/></linearGradient>
 <linearGradient id="mint" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#59E8C1"/><stop offset="1" stop-color="#78DDF4"/></linearGradient>
 <linearGradient id="violet" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9E8AFF"/><stop offset="1" stop-color="#D1A5FF"/></linearGradient>
 <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#8295BA" stroke-opacity=".06"/></pattern>
</defs>
<rect width="1200" height="520" rx="24" fill="url(#bg)" stroke="#3A4A69" stroke-opacity=".8"/><rect width="1200" height="520" rx="24" fill="url(#grid)"/>
<g font-family="Inter,Segoe UI,Arial,sans-serif">
 <text x="42" y="48" fill="#F3F7FF" font-size="24" font-weight="800" letter-spacing="-.3">ENGINEERING, MEASURED.</text>
 <text x="43" y="74" fill="#8EA0BE" font-size="12" letter-spacing="1.8" font-weight="700">SELECTED RESULTS FROM INTERNSHIP &amp; BUILT PRODUCTS</text>
 <rect x="1002" y="32" width="154" height="28" rx="14" fill="#142C32" stroke="#4BE4C2" stroke-opacity=".42"/><circle cx="1020" cy="46" r="4" fill="#6CF3C5"/><text x="1032" y="50" fill="#B5F5E5" font-size="10" font-weight="800" letter-spacing="1">REPORTED METRICS</text>
 <line x1="42" y1="96" x2="1158" y2="96" stroke="#536584" stroke-opacity=".5"/>
 <!-- four metric cards -->
 <g transform="translate(42 119)">
  <rect width="266" height="224" rx="17" fill="#111D2D" stroke="#4CDDBB" stroke-opacity=".48"/>
  <rect x="18" y="18" width="38" height="38" rx="11" fill="#163B3D"/><path d="M28 38h18M37 29v18" stroke="#6CF3C5" stroke-width="2" stroke-linecap="round"/>
  <text x="18" y="89" fill="#88A0B7" font-size="11" font-weight="800" letter-spacing="1.6">API PERFORMANCE</text>
  <text x="18" y="139" fill="#6CF3C5" font-size="46" font-weight="800">−30%</text>
  <text x="18" y="163" fill="#E2EAF7" font-size="13">Response latency</text><text x="18" y="182" fill="#9AABC5" font-size="12">reduced under peak load</text>
  <rect x="18" y="198" width="230" height="7" rx="3.5" fill="#26384A"/><rect x="18" y="198" width="184" height="7" rx="3.5" fill="url(#mint)"/>
 </g>
 <g transform="translate(326 119)">
  <rect width="266" height="224" rx="17" fill="#111D2D" stroke="#4CDDBB" stroke-opacity=".36"/>
  <rect x="18" y="18" width="38" height="38" rx="11" fill="#163B3D"/><path d="M27 30h20M27 37h15M27 44h12" stroke="#6CF3C5" stroke-width="2" stroke-linecap="round"/>
  <text x="18" y="89" fill="#88A0B7" font-size="11" font-weight="800" letter-spacing="1.6">DATA ACCESS</text>
  <text x="18" y="139" fill="#6CF3C5" font-size="46" font-weight="800">−25%</text>
  <text x="18" y="163" fill="#E2EAF7" font-size="13">Portfolio retrieval time</text><text x="18" y="182" fill="#9AABC5" font-size="12">after database schema changes</text>
  <rect x="18" y="198" width="230" height="7" rx="3.5" fill="#26384A"/><rect x="18" y="198" width="153" height="7" rx="3.5" fill="url(#mint)"/>
 </g>
 <g transform="translate(610 119)">
  <rect width="266" height="224" rx="17" fill="#15182D" stroke="#A08DFF" stroke-opacity=".52"/>
  <rect x="18" y="18" width="38" height="38" rx="11" fill="#2B2450"/><path d="M27 30l6 7-6 7M36 44h11" fill="none" stroke="#B6A1FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="18" y="89" fill="#A39ABF" font-size="11" font-weight="800" letter-spacing="1.6">QUERY EFFICIENCY</text>
  <text x="18" y="139" fill="#B6A1FF" font-size="46" font-weight="800">−20%</text>
  <text x="18" y="163" fill="#E2EAF7" font-size="13">Redundant finance queries</text><text x="18" y="182" fill="#A8A7C8" font-size="12">removed from workflows</text>
  <rect x="18" y="198" width="230" height="7" rx="3.5" fill="#2C2944"/><rect x="18" y="198" width="123" height="7" rx="3.5" fill="url(#violet)"/>
 </g>
 <g transform="translate(894 119)">
  <rect width="264" height="224" rx="17" fill="#15182D" stroke="#A08DFF" stroke-opacity=".43"/>
  <rect x="18" y="18" width="38" height="38" rx="11" fill="#2B2450"/><path d="M27 43v-7l6-5 6 3 7-9" fill="none" stroke="#B6A1FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="18" y="89" fill="#A39ABF" font-size="11" font-weight="800" letter-spacing="1.6">LEARNING OUTCOME</text>
  <text x="18" y="139" fill="#B6A1FF" font-size="46" font-weight="800">+18%</text>
  <text x="18" y="163" fill="#E2EAF7" font-size="13">Quiz scores in SmartSeed</text><text x="18" y="182" fill="#A8A7C8" font-size="12">reported over 60 days</text>
  <rect x="18" y="198" width="228" height="7" rx="3.5" fill="#2C2944"/><rect x="18" y="198" width="110" height="7" rx="3.5" fill="url(#violet)"/>
 </g>
 <!-- two bottom proof strips -->
 <g transform="translate(42 364)">
  <rect width="548" height="96" rx="15" fill="#0D1827" stroke="#445875" stroke-opacity=".75"/>
  <rect x="17" y="17" width="62" height="62" rx="13" fill="#143439"/>
  <text x="48" y="56" text-anchor="middle" fill="#6CF3C5" font-size="24" font-weight="800">2.5×</text>
  <text x="96" y="34" fill="#F0F5FF" font-size="15" font-weight="800">Data-validation pipelines scaled</text>
  <text x="96" y="57" fill="#8EA0BE" font-size="12">Springer Capital · operational workflow performance</text>
  <path d="M434 67v-9h11v9M450 67V48h11v19M466 67V36h11v31M482 67V24h11v43" fill="none" stroke="url(#mint)" stroke-width="4" stroke-linecap="round"/>
 </g>
 <g transform="translate(610 364)">
  <rect width="548" height="96" rx="15" fill="#0D1827" stroke="#445875" stroke-opacity=".75"/>
  <rect x="17" y="17" width="62" height="62" rx="13" fill="#282347"/>
  <text x="48" y="54" text-anchor="middle" fill="#B6A1FF" font-size="21" font-weight="800">~40h</text>
  <text x="96" y="34" fill="#F0F5FF" font-size="15" font-weight="800">Operations time saved each month</text>
  <text x="96" y="57" fill="#8EA0BE" font-size="12">Reported after data-validation pipeline improvements</text>
  <circle cx="496" cy="48" r="18" fill="none" stroke="#8D7CFF" stroke-opacity=".25" stroke-width="5"/><path d="M496 30a18 18 0 1 1-16 26" fill="none" stroke="#B6A1FF" stroke-width="5" stroke-linecap="round"/>
 </g>
 <text x="44" y="490" fill="#71829F" font-size="11">Percentages describe different outcomes and baselines; they are not directly comparable. Metrics are based on resume-reported results.</text>
</g>
</svg>