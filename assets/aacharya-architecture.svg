<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="t d"><title id="t">AACHARYA AI system map</title><desc id="d">A user query enters a Next.js API layer, image queries use Gemini Vision OCR, reasoning uses Groq then Gemini then a local fallback, then an output orchestrator produces visual, speech, talking-head video and 3D assets.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0A101C"/><stop offset="1" stop-color="#17152B"/></linearGradient><linearGradient id="mint" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#5DE7C1"/><stop offset="1" stop-color="#7DDDF6"/></linearGradient><linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8C7AFF"/><stop offset="1" stop-color="#C3A4FF"/></linearGradient></defs><rect width="1200" height="460" rx="22" fill="url(#bg)" stroke="#465576" stroke-opacity=".7"/><g font-family="Inter,Segoe UI,Arial,sans-serif"><text x="36" y="42" fill="#F3F7FF" font-size="22" font-weight="800">AACHARYA_AI / SYSTEM MAP</text><text x="36" y="65" fill="#899AB8" font-size="12" font-weight="700" letter-spacing="1.6">INPUT → REASONING → ORCHESTRATED LEARNING OUTPUTS</text>
<!-- arrows behind cards -->
<g fill="none" stroke="#54718A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M184 211H224"/><path d="M386 211H424"/><path d="M600 211H638"/><path d="M820 211H858"/><path d="M1016 211H1044"/><path d="M305 154V138"/><path d="M386 109H512V122"/></g><g fill="#67E6C8"><path d="M216 205l9 6-9 6Z"/><path d="M416 205l9 6-9 6Z"/><path d="M630 205l9 6-9 6Z"/><path d="M850 205l9 6-9 6Z"/><path d="M1036 205l9 6-9 6Z"/><path d="M299 138l6-9 6 9Z"/><path d="M506 122l6 9 6-9Z"/></g>
<!-- input -->
<g transform="translate(28 154)"><rect width="156" height="114" rx="15" fill="#142A37" stroke="#57D9C1" stroke-opacity=".72"/><text x="18" y="28" fill="#6CF3C5" font-size="10" font-weight="800" letter-spacing="1.5">01 / INPUT</text><text x="18" y="56" fill="#F2F7FF" font-size="17" font-weight="800">Student query</text><text x="18" y="79" fill="#B3C6DD" font-size="12">Text or image</text><rect x="18" y="91" width="38" height="5" rx="2.5" fill="#6CF3C5"/><rect x="62" y="91" width="24" height="5" rx="2.5" fill="#7DDDF6"/></g>
<!-- API and OCR -->
<g transform="translate(224 154)"><rect width="162" height="114" rx="15" fill="#16263D" stroke="#6598D7" stroke-opacity=".7"/><text x="17" y="28" fill="#89C6FF" font-size="10" font-weight="800" letter-spacing="1.5">02 / ROUTE</text><text x="17" y="55" fill="#F2F7FF" font-size="16" font-weight="800">Next.js API</text><text x="17" y="77" fill="#B4C4DA" font-size="12">Request handling</text><text x="17" y="94" fill="#B4C4DA" font-size="12">+ input parsing</text></g>
<g transform="translate(224 88)"><rect width="162" height="42" rx="11" fill="#201D40" stroke="#A295FF" stroke-opacity=".7"/><text x="14" y="17" fill="#C1B8FF" font-size="10" font-weight="800">IMAGE PATH</text><text x="14" y="32" fill="#F2F0FF" font-size="12" font-weight="700">Gemini Vision OCR</text></g>
<!-- reasoning -->
<g transform="translate(424 130)"><rect width="176" height="164" rx="15" fill="#162A31" stroke="#58DEBE" stroke-opacity=".75"/><text x="17" y="27" fill="#6CF3C5" font-size="10" font-weight="800" letter-spacing="1.5">03 / REASON</text><text x="17" y="51" fill="#F2F7FF" font-size="16" font-weight="800">Fallback chain</text><rect x="16" y="65" width="144" height="23" rx="7" fill="#1C4A4A"/><text x="88" y="81" text-anchor="middle" fill="#C5F9E9" font-size="12" font-weight="700">Groq</text><path d="M88 88v7" stroke="#6CF3C5" stroke-width="1.5"/><rect x="16" y="96" width="144" height="23" rx="7" fill="#203950"/><text x="88" y="112" text-anchor="middle" fill="#C9E8FF" font-size="12" font-weight="700">Gemini</text><path d="M88 119v7" stroke="#6CF3C5" stroke-width="1.5"/><rect x="16" y="126" width="144" height="23" rx="7" fill="#302B52"/><text x="88" y="142" text-anchor="middle" fill="#E2D8FF" font-size="12" font-weight="700">Local heuristic</text></g>
