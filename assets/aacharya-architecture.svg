<!-- fallback storage and note -->
<g transform="translate(1044 154)"><rect width="128" height="114" rx="15" fill="#22243B" stroke="#9D8BFF" stroke-opacity=".65"/><text x="14" y="27" fill="#B9A8FF" font-size="10" font-weight="800" letter-spacing="1.1">RESILIENCE</text><text x="14" y="50" fill="#F4F4FF" font-size="14" font-weight="800">Fallbacks</text><text x="14" y="72" fill="#C1C7DC" font-size="11">MongoDB → JSON</text><text x="14" y="89" fill="#C1C7DC" font-size="11">TripoSR → template</text><text x="14" y="103" fill="#C1C7DC" font-size="11">GLB</text></g>
<rect x="28" y="344" width="1144" height="76" rx="15" fill="#0D1725" stroke="#354966" stroke-opacity=".8"/><circle cx="53" cy="371" r="5" fill="#6CF3C5"/><text x="69" y="375" fill="#E8F4FF" font-size="13" font-weight="800">Engineering principle</text><text x="69" y="396" fill="#91A5C4" font-size="12">Prefer graceful degradation: a missing integration should reduce capability, not break the entire learning experience.</text><text x="1148" y="442" text-anchor="end" fill="#687B9B" font-size="10">Conceptual flow based on the described project architecture</text>
</g></svg>